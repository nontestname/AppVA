site_name: AppVA
site_description: From GUI Tests to Conversational Interaction: A New Perspective on App-Specific Voice Assistants
site_url: https://nontestname.github.io/appva/

docs_dir: docs

nav:
  - Home: index.md
  - Running Example: running_example.md
  - Runtime Server & Client: runtime_server_client.md
  - CLI Guide: cli.md
  - Tool Paper & Evaluation: tool_paper.md

repo_url: https://github.com/nontestname/appva
repo_name: GitHub # label next to the icon (optional)
edit_uri: ''

theme:
  name: cinder

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
      linenums: false
  - pymdownx.highlight
  - pymdownx.superfences
