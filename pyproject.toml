[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "appva"
version = "0.1.0"
description = "AppVA: From GUI Tests to Conversational Interaction: A New Perspective on App-Specific Voice Assistants"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AppVA Contributors" },
]
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "pydantic>=1.10",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
appva = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "runtime*", "exceptions*", "configs*"]

